<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IKB scan stress 0/0</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  input { width: 100%; font-size: 28px; padding: 8px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
  .tile { flex: 1 1 40%; background: #f1f5f9; border-radius: 8px; padding: 10px; }
  .tile b { display: block; font-size: 36px; }
  .tile span { font-size: 13px; color: #555; }
  #missing, #errors { font-family: monospace; font-size: 14px; word-break: break-all; }
  button { font-size: 16px; padding: 8px 12px; }
  label { font-size: 14px; }
</style>
</head>
<body>
<h3>Industrial Kiosk Browser – scan stress test</h3>
<input id="field" type="text" autofocus autocomplete="off" placeholder="scan target field">
<div class="row">
  <div class="tile"><b id="events">0</b><span>scan events (industrialkioskbrowser:scan)</span></div>
  <div class="tile"><b id="enters">0</b><span>Enter terminators in field</span></div>
  <div class="tile"><b id="last">–</b><span>last value</span></div>
  <div class="tile"><b id="maxseq">0</b><span>highest sequence seen</span></div>
</div>
<div class="row">
  <label><input id="prevent" type="checkbox"> preventDefault (JS-event only, nothing typed)</label>
  <button id="reset">reset</button>
</div>
<p>Missing sequence numbers (events): <span id="missing">none</span></p>
<p>Out-of-order events: <b id="ooo">0</b> · duplicates: <b id="dups">0</b> · Enter without value: <b id="emptyEnter">0</b></p>
<p>Mismatched field values at Enter: <span id="errors">none</span></p>
<script>
(function () {
  var field = document.getElementById('field');
  var state = { events: 0, enters: 0, maxseq: 0, seen: {}, ooo: 0, dups: 0, emptyEnter: 0, lastSeq: 0, errors: [], last: '' };
  var seqRe = /^SCAN(\d+)$/;

  function missing() {
    var out = [];
    for (var i = 1; i <= state.maxseq; i++) if (!state.seen[i]) out.push(i);
    return out;
  }
  function render() {
    document.getElementById('events').textContent = state.events;
    document.getElementById('enters').textContent = state.enters;
    document.getElementById('last').textContent = state.last || '–';
    document.getElementById('maxseq').textContent = state.maxseq;
    document.getElementById('ooo').textContent = state.ooo;
    document.getElementById('dups').textContent = state.dups;
    document.getElementById('emptyEnter').textContent = state.emptyEnter;
    var m = missing();
    document.getElementById('missing').textContent = m.length ? m.join(',') : 'none';
    document.getElementById('errors').textContent = state.errors.length ? state.errors.join(' ') : 'none';
    // Machine-readable summary for `dumpsys activity top` / screenshots.
    document.title = 'IKB ev=' + state.events + ' enter=' + state.enters + ' max=' + state.maxseq +
      ' miss=' + m.length + ' ooo=' + state.ooo + ' dup=' + state.dups + ' err=' + state.errors.length;
  }
  function noteSeq(value) {
    var m = seqRe.exec(value);
    if (!m) return;
    var n = parseInt(m[1], 10);
    if (state.seen[n]) state.dups++;
    state.seen[n] = true;
    if (n < state.lastSeq) state.ooo++;
    state.lastSeq = n;
    if (n > state.maxseq) state.maxseq = n;
  }
  window.addEventListener('industrialkioskbrowser:scan', function (e) {
    // Control codes: scanning "RESET" clears the counters, "PREVENT-ON"/"PREVENT-OFF" toggles preventDefault.
    if (e.detail.data === 'RESET') { e.preventDefault(); document.getElementById('reset').click(); return; }
    if (e.detail.data === 'PREVENT-ON' || e.detail.data === 'PREVENT-OFF') {
      e.preventDefault(); document.getElementById('prevent').checked = e.detail.data === 'PREVENT-ON'; render(); return;
    }
    state.events++;
    state.last = e.detail.data;
    noteSeq(e.detail.data);
    if (document.getElementById('prevent').checked) e.preventDefault();
    render();
  });
  field.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    state.enters++;
    var v = field.value;
    if (!v) state.emptyEnter++;
    else if (!seqRe.test(v)) state.errors.push(JSON.stringify(v));
    field.value = '';
    render();
  });
  document.getElementById('reset').addEventListener('click', function () {
    state = { events: 0, enters: 0, maxseq: 0, seen: {}, ooo: 0, dups: 0, emptyEnter: 0, lastSeq: 0, errors: [], last: '' };
    field.value = ''; render(); field.focus();
  });
  // Keep the field focused so the wedge always has a target.
  setInterval(function () { if (document.activeElement !== field) field.focus(); }, 500);
  field.focus();
  render();
})();
</script>
</body>
</html>
