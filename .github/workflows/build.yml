# Nach der Vorlage aus ict-baden/richtlinien, für eine Android-App (Gradle statt .NET, APK statt MSI).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # für die Releases
  id-token: write # Herkunftsnachweis (attest-build-provenance), nur bei öffentlichem Repo genutzt
  attestations: write

# Läufe auf demselben Branch nacheinander, damit sich die 'latest'-Releases nicht überholen
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: Pforte
  # Signieren nur mit dem Keystore aus den Secrets (siehe richtlinien/05-signieren.md) und nicht bei Pull Requests.
  # Ohne Schlüssel wird gebaut und getestet, aber keine APK veröffentlicht: Eine unsignierte APK lässt sich nicht installieren,
  # und eine mit einem anderen Schlüssel signierte ließe sich später nicht mehr aktualisieren. Auch keine Debug-APK: Sie ist
  # ein anderes Paket (….debug) mit WebView-Debugging, und Richtlinie 05 sieht für Android nur den Release-Schlüssel vor.
  SIGN: ${{ secrets.ANDROID_KEYSTORE != '' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ env.SIGN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          # Tag v1.2.3 -> 1.2.3, sonst Basisversion aus app/build.gradle.kts mit Laufnummer
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"; suffix="-$v"
          else
            base=$(grep -oP 'versionName = .*?"\K[0-9.]+' app/build.gradle.kts)
            v="$base-ci.$GITHUB_RUN_NUMBER"; suffix=""
          fi
          # versionCode muss bei jedem Build steigen, sonst verweigern Android und das MDM das Update
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Version: $v (Code $GITHUB_RUN_NUMBER), Signieren: $SIGN"

      - name: Release-Text aus dem CHANGELOG (nur bei Tag v*)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # Abschnitt der Version (englisch), bei Vorabversionen ersatzweise „Unreleased“; relative Links auf den Stand des Tags
          section() {
            awk -v head="$1" 'index($0, "## ") == 1 { if (found) exit; found = index($0, head) == 1; next } found' CHANGELOG.md \
              | perl -pe 's{\]\((?!https?://|#|mailto:)([^)]+)\)}{](https://github.com/$ENV{GITHUB_REPOSITORY}/blob/$ENV{GITHUB_REF_NAME}/$1)}g'
          }
          version="${GITHUB_REF_NAME#v}"
          section "## [$version]" > "$RUNNER_TEMP/changes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"; then
            case "$version" in *-*) section "## Unreleased" > "$RUNNER_TEMP/changes.md";; esac
          fi
          grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md" || { echo "::error::CHANGELOG.md hat keinen Abschnitt [$version]"; exit 1; }

      - name: Tests und Lint
        run: ./gradlew testDebugUnitTest lintDebug --console=plain

      - name: Drittanbieter-Lizenzen prüfen (THIRD-PARTY-NOTICES.txt gegen die Bibliotheken der APK)
        run: ./.github/scripts/check-notices.sh

      - name: Testergebnisse
        if: always()
        # Nur zur Diagnose: ein volles Artefakt-Kontingent darf den Build nicht abbrechen
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Testergebnisse
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Keystore bereitstellen
        if: env.SIGN == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK und App Bundle bauen und signieren
        if: env.SIGN == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # PKCS12-Keystores haben ein gemeinsames Passwort für Store und Schlüssel; eigenes Secret nur, falls abweichend
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --console=plain -PversionName=${{ steps.version.outputs.version }} -PversionCode=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APP${{ steps.version.outputs.suffix }}.apk"
          # Das App Bundle ist für Google Play (mit unserem Schlüssel als Upload-Schlüssel, siehe docs/play-store.md)
          cp app/build/outputs/bundle/release/app-release.aab "dist/$APP${{ steps.version.outputs.suffix }}.aab"
          # Prüfen, dass wirklich mit dem Release-Schlüssel signiert wurde
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/$APP${{ steps.version.outputs.suffix }}.apk" | head -3
          jarsigner -verify "dist/$APP${{ steps.version.outputs.suffix }}.aab" | grep -q "jar verified" || { echo "::error::App Bundle ist nicht signiert"; exit 1; }
          rm "$RUNNER_TEMP/release.jks"

      - name: Ohne Schlüssel keine APK
        if: env.SIGN != 'true' && github.event_name != 'pull_request'
        run: echo "::notice::Kein Keystore in den Secrets (ANDROID_KEYSTORE …) – gebaut und getestet, aber keine APK veröffentlicht."

      - name: SBOM (CycloneDX)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          python3 .github/scripts/sbom.py "${{ steps.version.outputs.version }}" build/release-dependencies.txt "dist/$APP${{ steps.version.outputs.suffix }}.cdx.json"

      - name: Prüfsummen
        if: github.event_name != 'pull_request'
        working-directory: dist
        run: sha256sum $(ls | grep -v '^SHA256SUMS.txt$') | tee SHA256SUMS.txt

      - name: Herkunftsnachweis (nur bei öffentlichem Repo)
        # GitHub-Attestierungen gibt es für private Repos nur mit Enterprise; ab dem Umschalten auf öffentlich läuft der Schritt
        if: env.SIGN == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab

      - uses: actions/upload-artifact@v7
        if: env.SIGN == 'true'
        # Die APK liegt ohnehin im Release; ein volles Kontingent darf das Release nicht verhindern
        continue-on-error: true
        with:
          name: ${{ env.APP }}-${{ steps.version.outputs.version }}
          retention-days: 7
          path: dist/*
          if-no-files-found: error

      - name: Release erstellen oder ergänzen (nur bei Tag v*)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UNSIGNED_NOTE: '**The signed APK and App Bundle will be added here once the release signing key is set up.**'
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Ohne Schlüssel steht das Release mit SBOM und Prüfsummen schon da, oben der Hinweis auf die fehlende APK.
            # Nach dem Setzen der Secrets: gh workflow run build.yml --ref <tag>, dann kommen APK und App Bundle dazu.
            { if [ "$SIGN" != true ]; then printf '%s\n\n' "$UNSIGNED_NOTE"; fi; cat "$RUNNER_TEMP/changes.md"; } > "$RUNNER_TEMP/notes.md"
            # v1.0.0-rc1 und ähnliche: Vorabversion
            pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$APP $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --latest=false $pre
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          if [ "$SIGN" = true ]; then
            # Nachgereichte Signatur: Hinweis entfernen (nur wenn er da ist; scheitert das Lesen, bricht der Schritt ab)
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if [[ $body == *"$UNSIGNED_NOTE"* ]]; then
              printf '%s\n' "$body" | { grep -vF "$UNSIGNED_NOTE" || true; } | sed '1{/^\r\?$/d}' > "$RUNNER_TEMP/notes.md"
              gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          fi
          # „Latest“ wird das Release mit der höchsten Version, auch noch ohne APK: GitHub macht das neueste Release ohnehin
          # dazu, und der Hinweis oben sagt, was fehlt. Ein nachgereichter Lauf eines älteren Tags ändert daran nichts.
          case "$GITHUB_REF_NAME" in *-*) ;; *)
            newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
            if [ "$newest" = "$GITHUB_REF_NAME" ]; then gh release edit "$GITHUB_REF_NAME" --latest
            else echo "::notice::$GITHUB_REF_NAME bleibt ohne „Latest“, höchste Version ist ${newest:-unbekannt}."; fi;;
          esac

      - name: "Release 'latest' aktualisieren (main)"
        if: env.SIGN == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Rollierendes Release: immer der neueste main-Stand, unter festen Links (Einzelheiten im Skript)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/latest"
          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $notes = "Automatischer Build von main ($($env:GITHUB_SHA.Substring(0,7))), Version ${{ steps.version.outputs.version }}, gebaut $built UTC, signiert.`n`n" +
                   "Die Links bleiben gleich und zeigen immer auf den neuesten Build:`n`n" +
                   "- **[$env:APP.apk]($base/$env:APP.apk)**: zum Verteilen per MDM (SOTI, Intune, StageNow) oder zum Installieren per adb`n" +
                   "- [$env:APP.cdx.json]($base/$env:APP.cdx.json): Stückliste (SBOM, CycloneDX)`n" +
                   "- [SHA256SUMS.txt]($base/SHA256SUMS.txt): Prüfsummen"
          ./.github/scripts/release-latest.ps1 -Notes $notes -Title "Latest Build (main) – ${{ steps.version.outputs.version }}"

  # Der erste signierte Lauf eines Tags (Secrets nachträglich gesetzt) stößt einen Build von main an, damit auch das
  # rollierende „latest“ entsteht – sonst käme es erst mit dem nächsten Push auf main.
  latest-anstossen:
    needs: build
    if: github.ref_type == 'tag' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: "Build von main anstoßen, falls 'latest' fehlt"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "'latest' gibt es schon."
          else
            gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "::notice::Build von main angestoßen, er legt das Release 'latest' an."
          fi
