# Nach der Vorlage aus ict-baden/richtlinien, für eine Android-App (Gradle statt .NET, APK statt MSI).
name: Build

# Wann wie viel gebaut wird, steht in Richtlinie 04 („Wann die CI baut“). Kurz: Pushs und PRs bauen, testen und prüfen
# nur (Debug-APK, Unit-Tests, Lint). Signiert und veröffentlicht wird nur im vollen Build: nachts (nur wenn main neu ist),
# bei Tags, von Hand und mit [voll] in der Commit-Nachricht. Reine Doku startet nichts.
on:
  push:
    branches: [main]
    tags: ['v*'] # Pfadfilter gelten für Tags nicht, ein Tag baut immer
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  schedule:
    - cron: '7 3 * * *' # Minute je Repo anders, damit nicht alle gleichzeitig starten
  workflow_dispatch:

# Nur lesen. Schreibrechte bekommt allein der Job „release“ weiter unten; Bauen und Testen (auch in Pull Requests)
# laufen mit einem Token, das nichts verändern kann.
permissions:
  contents: read

# Läufe auf demselben Branch nacheinander, damit sich die 'latest'-Releases nicht überholen.
# In PRs bricht ein neuer Push den alten Lauf ab.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP: IndustrialKioskBrowser
  # SHA-256-Fingerabdruck des Release-Zertifikats. Er ist öffentlich (steht in jeder APK). Der Build bricht ab, wenn die
  # signierte APK ein anderes Zertifikat trägt. Nur bei einem bewussten Schlüsselwechsel anpassen.
  RELEASE_CERT_SHA256: 09ecfbc5891c919ce2262919b67ca83f15f2bcd4b7913ec9b14b7e6fc2935201
  # Google Play nur mit dem JSON-Schlüssel eines Service-Kontos (Secret PLAY_SERVICE_ACCOUNT_JSON, docs/play-store.md):
  # main -> interner Test, Tag v1.2.3 -> Produktion (Google prüft vorher), Tag mit Bindestrich (v1.2.3-rc1) -> interner Test.
  PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.ANDROID_KEYSTORE != '' && github.event_name != 'pull_request' }}

jobs:
  # Entscheidet, wie viel dieser Lauf baut. run=false: nichts zu tun (Nachtlauf ohne neue Commits).
  # full=true: signierter Release-Build, SBOM, Releases (bei Android das Einzige, was der volle Build zusätzlich macht).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      full: ${{ steps.gate.outputs.full }}
    steps:
      - name: Umfang bestimmen
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
          # Geänderte Dateien, bei denen ein PR voll bauen soll. Android baut nur unter Linux, und Signieren und Releases
          # laufen in PRs ohnehin nie: voll heißt im PR dasselbe wie sonst. Bleibt für Workflow-Änderungen (Richtlinie 04).
          FULL_PATHS: '^\.github/'
          # Reine Doku, wie paths-ignore oben
          DOC_PATHS: '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/)'
        run: |
          set -euo pipefail
          run=true; full=false
          case "$EVENT" in
            workflow_dispatch) full=true ;;
            push)
              # Bei mehreren Commits in einem Push zählt die Nachricht des letzten
              if [ "$GITHUB_REF_TYPE" = tag ] || [[ "$MSG" == *"[voll]"* ]]; then full=true; fi ;;
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
              if [[ ",$LABELS," == *",voll-bauen,"* ]] || grep -qE "$FULL_PATHS" <<< "$files"; then full=true; fi ;;
            schedule)
              # Der Tag 'latest' steht auf dem Commit des letzten vollen Builds von main
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq .object.sha 2>/dev/null || true)
              if [ "$built" = "$GITHUB_SHA" ]; then
                run=false
              else
                # Scheitert der Vergleich (kein 'latest', Verlauf umgeschrieben), wird voll gebaut
                changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$built...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || echo '?')
                if [ -n "$built" ] && ! grep -qvE "$DOC_PATHS" <<< "$changed"; then run=false; else full=true; fi # sonst nur Doku
              fi ;;
          esac
          echo "Ereignis: $EVENT  run=$run  full=$full"
          { echo "run=$run"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

  # Läuft bei jedem Push und PR. Signieren, SBOM und Releases nur im vollen Build (FULL, SIGN).
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    env:
      FULL: ${{ needs.gate.outputs.full }}
      # Signieren nur im vollen Build, mit dem Keystore aus den Secrets (siehe richtlinien/05-signieren.md) und nicht bei
      # Pull Requests. Ohne Schlüssel wird gebaut und getestet, aber keine APK veröffentlicht: Eine unsignierte APK lässt sich
      # nicht installieren, und eine mit einem anderen Schlüssel signierte ließe sich später nicht mehr aktualisieren. Auch
      # keine Debug-APK: Sie ist ein anderes Paket (….debug) mit WebView-Debugging, und Richtlinie 05 sieht für Android nur
      # den Release-Schlüssel vor.
      SIGN: ${{ secrets.ANDROID_KEYSTORE != '' && github.event_name != 'pull_request' && needs.gate.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ env.SIGN }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions sind auf Commits festgelegt, nicht auf Tags: Ein Tag lässt sich umhängen, ein Commit nicht.
      # Dependabot hebt Commit und Versionskommentar gemeinsam an.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Version bestimmen
        id: version
        shell: bash
        run: |
          # Tag v1.2.3 -> 1.2.3, sonst Basisversion aus app/build.gradle.kts mit Laufnummer.
          # Die Laufnummer hat in diesem Repository einmal neu bei 1 begonnen. Der Aufschlag hält sie über allen
          # früheren Builds (zuletzt 75, bei Google Play 50). Nie verkleinern.
          n=$((GITHUB_RUN_NUMBER + 100))
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"; suffix="-$v"
          else
            base=$(grep -oP 'versionName = .*?"\K[0-9.]+' app/build.gradle.kts)
            v="$base-ci.$n"; suffix=""
          fi
          # versionCode muss bei jedem Build steigen, sonst verweigern Android und das MDM das Update
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$n" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Version: $v (Code $n), Signieren: $SIGN"

      - name: Release-Text aus dem CHANGELOG (nur bei Tag v*)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # Abschnitt der Version (englisch), bei Vorabversionen ersatzweise „Unreleased“; relative Links auf den Stand des Tags
          section() {
            awk -v head="$1" 'index($0, "## ") == 1 { if (found) exit; found = index($0, head) == 1; next } found' CHANGELOG.md \
              | perl -pe 's{\]\((?!https?://|#|mailto:)([^)]+)\)}{](https://github.com/$ENV{GITHUB_REPOSITORY}/blob/$ENV{GITHUB_REF_NAME}/$1)}g'
          }
          version="${GITHUB_REF_NAME#v}"
          section "## [$version]" > "$RUNNER_TEMP/changes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"; then
            case "$version" in *-*) section "## Unreleased" > "$RUNNER_TEMP/changes.md";; esac
          fi
          grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md" || { echo "::error::CHANGELOG.md hat keinen Abschnitt [$version]"; exit 1; }

      # Robolectric lädt seine Android-Bibliothek (rund 150 MB) bei jedem Testlauf selbst von Maven Central nach ~/.m2,
      # am Gradle-Cache vorbei. Antwortet Maven Central gerade nicht, scheitern alle Robolectric-Tests und damit auch
      # ein Release-Build. Mit dem Zwischenspeicher braucht nur der erste Lauf nach einem Robolectric-Update das Netz.
      - name: Robolectric-Version (Schlüssel für den Zwischenspeicher)
        id: robolectric
        run: echo "key=$(grep -h 'org.robolectric' app/build.gradle.kts | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Robolectric-Bibliotheken zwischenspeichern
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.key }}
          restore-keys: robolectric-

      - name: Tests, Lint und Debug-Build
        # Debug-APK nur als Probe, dass sich die App bauen lässt (wird nicht veröffentlicht, Release-Build nur im vollen Build)
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Drittanbieter-Lizenzen prüfen (THIRD-PARTY-NOTICES.txt gegen die Bibliotheken der APK)
        run: ./.github/scripts/check-notices.sh

      - name: Testergebnisse
        if: always()
        # Nur zur Diagnose: ein volles Artefakt-Kontingent darf den Build nicht abbrechen
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Testergebnisse
          retention-days: 7
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Keystore bereitstellen
        if: env.SIGN == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK und App Bundle bauen und signieren
        if: env.SIGN == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # PKCS12-Keystores haben ein gemeinsames Passwort für Store und Schlüssel; eigenes Secret nur, falls abweichend
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --console=plain -PversionName=${{ steps.version.outputs.version }} -PversionCode=${{ steps.version.outputs.code }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APP${{ steps.version.outputs.suffix }}.apk"
          # Das App Bundle ist für Google Play (mit unserem Schlüssel als Upload-Schlüssel, siehe docs/play-store.md)
          cp app/build/outputs/bundle/release/app-release.aab "dist/$APP${{ steps.version.outputs.suffix }}.aab"
          # R8-Mapping für lesbare Stacktraces aus Absturzberichten (steckt auch im App Bundle für die Play Console)
          cp app/build/outputs/mapping/release/mapping.txt "dist/$APP${{ steps.version.outputs.suffix }}-mapping.txt"
          # Prüfen, dass wirklich mit dem Release-Schlüssel signiert wurde: Zertifikat ausgeben und mit RELEASE_CERT_SHA256
          # vergleichen. Auf dem Runner liegen mehrere build-tools-Versionen, deshalb gezielt die neueste nehmen.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          [ -x "$apksigner" ] || { echo "::error::apksigner nicht gefunden"; exit 1; }
          certs=$("$apksigner" verify --print-certs "dist/$APP${{ steps.version.outputs.suffix }}.apk")
          echo "$certs" | head -n 3
          echo "$certs" | grep -qiF "certificate SHA-256 digest: $RELEASE_CERT_SHA256" || { echo "::error::APK trägt nicht das Release-Zertifikat (erwartet $RELEASE_CERT_SHA256)"; exit 1; }
          jarsigner -verify "dist/$APP${{ steps.version.outputs.suffix }}.aab" | grep -q "jar verified" || { echo "::error::App Bundle ist nicht signiert"; exit 1; }
          rm "$RUNNER_TEMP/release.jks"

      - name: Ohne Schlüssel keine APK
        if: env.SIGN != 'true' && env.FULL == 'true' && github.event_name != 'pull_request'
        run: echo "::notice::Kein Keystore in den Secrets (ANDROID_KEYSTORE …) – gebaut und getestet, aber keine APK veröffentlicht."

      - name: SBOM (CycloneDX)
        if: env.FULL == 'true' && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          python3 .github/scripts/sbom.py "${{ steps.version.outputs.version }}" build/release-dependencies.txt "dist/$APP${{ steps.version.outputs.suffix }}.cdx.json"

      - name: Prüfsummen
        if: env.FULL == 'true' && github.event_name != 'pull_request'
        working-directory: dist
        run: sha256sum $(ls | grep -v '^SHA256SUMS.txt$') | tee SHA256SUMS.txt

      - name: Dateien an den Job „release“ übergeben
        if: env.FULL == 'true' && github.event_name != 'pull_request'
        # Auch ohne Schlüssel: Bei einem Tag entsteht das Release dann nur mit SBOM und Prüfsummen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APP }}-${{ steps.version.outputs.version }}
          retention-days: 7
          path: dist/*
          if-no-files-found: error

      - name: Release-Text an den Job „release“ übergeben (nur bei Tag v*)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Release-Text
          retention-days: 7
          path: ${{ runner.temp }}/changes.md
          if-no-files-found: error

  # Alles, was Schreibrechte braucht: Herkunftsnachweis, Google Play und die Releases. Nur im vollen Build und nie bei
  # Pull Requests. Der Job baut nichts selbst, er nimmt die Dateien aus „build“.
  release:
    needs: [gate, build]
    if: needs.gate.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # für die Releases
      id-token: write # Herkunftsnachweis (attest-build-provenance), nur bei öffentlichem Repo genutzt
      attestations: write
    env:
      SIGN: ${{ needs.build.outputs.signed }}
    steps:
      # Für play/whatsnew und .github/scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dateien aus „build“ holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.APP }}-${{ needs.build.outputs.version }}
          path: dist

      - name: Release-Text aus „build“ holen (nur bei Tag v*)
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Release-Text
          path: ${{ runner.temp }}

      - name: Herkunftsnachweis (nur bei öffentlichem Repo)
        # GitHub-Attestierungen gibt es für private Repos nur mit Enterprise; ab dem Umschalten auf öffentlich läuft der Schritt
        if: env.SIGN == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab

      - name: Play-Versionshinweise prüfen
        if: env.SIGN == 'true' && env.PLAY == 'true' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        run: |
          # Kurztexte für Play in play/whatsnew/whatsnew-<Sprache>, höchstens 500 Zeichen; vor jedem Release pflegen
          for f in play/whatsnew/whatsnew-*; do
            n=$(wc -m < "$f"); [ "$n" -le 500 ] || { echo "::error::$f hat $n Zeichen, Play erlaubt 500"; exit 1; }
          done

      - name: Google Play (main → interner Test, Tag → Produktion)
        if: env.SIGN == 'true' && env.PLAY == 'true' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        # Fester Commit statt Tag: die Action bekommt den Play-Schlüssel
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.ictbaden.industrialkioskbrowser
          releaseFiles: dist/*.aab
          releaseName: ${{ needs.build.outputs.version }}
          track: ${{ (github.ref_type == 'tag' && !contains(github.ref_name, '-')) && 'production' || 'internal' }}
          status: completed
          whatsNewDirectory: play/whatsnew

      - name: Ohne Play-Schlüssel nichts zu Google Play
        if: env.SIGN == 'true' && env.PLAY != 'true' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        run: echo "::notice::Kein PLAY_SERVICE_ACCOUNT_JSON in den Secrets – nichts zu Google Play hochgeladen."

      - name: Release erstellen oder ergänzen (nur bei Tag v*)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UNSIGNED_NOTE: '**The signed APK and App Bundle will be added here once the release signing key is set up.**'
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Ohne Schlüssel steht das Release mit SBOM und Prüfsummen schon da, oben der Hinweis auf die fehlende APK.
            # Nach dem Setzen der Secrets: gh workflow run build.yml --ref <tag>, dann kommen APK und App Bundle dazu.
            { if [ "$SIGN" != true ]; then printf '%s\n\n' "$UNSIGNED_NOTE"; fi; cat "$RUNNER_TEMP/changes.md"; } > "$RUNNER_TEMP/notes.md"
            # v1.0.0-rc1 und ähnliche: Vorabversion
            pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$APP $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --latest=false $pre
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          if [ "$SIGN" = true ]; then
            # Nachgereichte Signatur: Hinweis entfernen (nur wenn er da ist; scheitert das Lesen, bricht der Schritt ab)
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if [[ $body == *"$UNSIGNED_NOTE"* ]]; then
              printf '%s\n' "$body" | { grep -vF "$UNSIGNED_NOTE" || true; } | sed '1{/^\r\?$/d}' > "$RUNNER_TEMP/notes.md"
              gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          fi
          # „Latest“ wird das Release mit der höchsten Version, auch noch ohne APK: GitHub macht das neueste Release ohnehin
          # dazu, und der Hinweis oben sagt, was fehlt. Ein nachgereichter Lauf eines älteren Tags ändert daran nichts.
          case "$GITHUB_REF_NAME" in *-*) ;; *)
            newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
            if [ "$newest" = "$GITHUB_REF_NAME" ]; then gh release edit "$GITHUB_REF_NAME" --latest
            else echo "::notice::$GITHUB_REF_NAME bleibt ohne „Latest“, höchste Version ist ${newest:-unbekannt}."; fi;;
          esac

      - name: "Release 'latest' aktualisieren (main)"
        # Auch nachts und bei [voll]-Pushs (Richtlinie 04); SIGN gibt es nur im vollen Build
        if: env.SIGN == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Rollierendes Release: immer der neueste main-Stand, unter festen Links (Einzelheiten im Skript)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/latest"
          $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $notes = "Automatischer Build von main ($($env:GITHUB_SHA.Substring(0,7))), Version ${{ needs.build.outputs.version }}, gebaut $built UTC, signiert.`n`n" +
                   "Die Links bleiben gleich und zeigen immer auf den neuesten Build:`n`n" +
                   "- **[$env:APP.apk]($base/$env:APP.apk)**: zum Verteilen per MDM (SOTI, Intune, StageNow) oder zum Installieren per adb`n" +
                   "- [$env:APP.cdx.json]($base/$env:APP.cdx.json): Stückliste (SBOM, CycloneDX)`n" +
                   "- [SHA256SUMS.txt]($base/SHA256SUMS.txt): Prüfsummen"
          ./.github/scripts/release-latest.ps1 -Notes $notes -Title "Latest Build (main) – ${{ needs.build.outputs.version }}"

  # Der erste signierte Lauf eines Tags (Secrets nachträglich gesetzt) stößt einen Build von main an, damit auch das
  # rollierende „latest“ entsteht – sonst käme es erst mit dem nächsten Push auf main.
  latest-anstossen:
    needs: build
    if: github.ref_type == 'tag' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: "Build von main anstoßen, falls 'latest' fehlt"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "'latest' gibt es schon."
          else
            gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "::notice::Build von main angestoßen, er legt das Release 'latest' an."
          fi
